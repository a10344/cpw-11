<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição | Game Sense</title>
  </head>

  <body>
    <header>
      <h1>Inscrição no Game Sense</h1>

      <nav>
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="atividades.html">Atividades</a></li>
          <li><a href="inscricao.html">Inscrição</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Formulário de inscrição</h2>

        <p>Preenche o formulário para escolheres a oficina em que gostarias de participar.</p>

        <form action="inscricao.html" method="get">
          <p>
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" required>
          </p>

          <p>
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="oficina">Escolhe uma oficina *</label>
            <select id="oficina" name="oficina" required>
              <option value="">Seleciona uma oficina</option>
              <option value="paginas-web">Páginas web</option>
              <option value="robotica">Robótica</option>
              <option value="jogos">Jogos</option>
            </select>
          </p>

          <p>
            <label for="mensagem">Mensagem (opcional)</label>
            <textarea id="mensagem" name="mensagem" rows="4"></textarea>
          </p>

          <button type="submit">Testar inscrição</button>
        </form>

        <p>Este formulário é apenas um protótipo. Não são registadas inscrições reais.</p>
      </section>
    </main>

    <footer>
      <p>Game Sense · Projeto escolar de CPW</p>
    </footer>
  </body>
</html>
